<!-- step badges -->
<g>
  <circle cx="290" cy="242" r="13" class="b"/><text x="290" y="247" class="bn">1</text>
  <circle cx="554" cy="242" r="13" class="b"/><text x="554" y="247" class="bn">2</text>
  <circle cx="818" cy="242" r="13" class="b"/><text x="818" y="247" class="bn">3</text>
  <circle cx="1082" cy="242" r="13" class="b"/><text x="1082" y="247" class="bn">4</text>
  <circle cx="1082" cy="668" r="13" class="bg"/><text x="1082" y="673" class="bn">5</text>
  <circle cx="818" cy="668" r="13" class="bg"/><text x="818" y="673" class="bn">6</text>
  <circle cx="554" cy="668" r="13" class="bg"/><text x="554" y="673" class="bn">7</text>
  <circle cx="290" cy="668" r="13" class="bg"/><text x="290" y="673" class="bn">8</text>
</g>

<!-- travelling packets -->
<g filter="url(#glow)">
  <!-- forward build/deploy packet (cyan) -->
  <circle r="7" fill="#22e1ff">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.58;1"
      path="M160 241V577H290V241H424V577H554V241H688V577H818V241H952V577H1082V241H1216V577"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.57;.58;1"/>
  </circle>
  <!-- return verification/telemetry packet (green) -->
  <circle r="7" fill="#2cff9a">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;.58;1"
      path="M1216 577V668H160"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.58;.59;1"/>
  </circle>
</g>

<!-- phase caption -->
<g font-size="15" font-weight="700" text-anchor="middle">
  <text x="688" y="754" fill="#22e1ff" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.57;.58;1"/>Pipeline flowing from Data Ingestion → UML &amp; Stack → Full-Stack Build → Cloud Deployment</text>
  <text x="688" y="754" fill="#2cff9a" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.58;.59;1"/>Continuous verification &amp; production telemetry feeding back into Requirements &amp; Build</text>
</g>
</svg>
