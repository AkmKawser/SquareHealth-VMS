<text x="424" y="236" class="t">SRS Specification</text><text x="424" y="258" class="s">(FR-01–FR-10 &amp; NFRs)</text>

<rect class="n lc" style="animation-delay:2.0s" x="331" y="316" width="186" height="74" rx="10"/>
<text x="424" y="348" class="t">UML Blueprints</text><text x="424" y="370" class="s">(Use Case, Seq, State, Class)</text>

<rect class="n lc" style="animation-delay:2.4s" x="331" y="428" width="186" height="74" rx="10"/>
