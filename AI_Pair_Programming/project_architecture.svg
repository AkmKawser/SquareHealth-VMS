<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0b1424"/></linearGradient>
  <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22e1ff"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2cff9a"/></marker>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{fill:#e8eef8;font-size:15px;text-anchor:middle}
    .s{fill:#aab6c8;font-size:12px;text-anchor:middle}
    .h{fill:#f2f6fc;font-size:17px;font-weight:700;text-anchor:middle;letter-spacing:.5px}
    .panel{fill:#0d1522;stroke:#1f2d44;stroke-width:1.5}
    .n{fill:#131c2b;stroke:#2c3b55;stroke-width:1.6}
    .c{fill:none;stroke:#22e1ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:dash 1s linear infinite;marker-end:url(#ac)}
    .g{fill:none;stroke:#2cff9a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:dash 1s linear infinite;marker-end:url(#ag)}
    @keyframes dash{to{stroke-dashoffset:-16}}
    .lc{animation:litc 12s infinite}
    .lg{animation:litg 12s infinite}
    @keyframes litc{0%{stroke:#2c3b55;fill:#131c2b}2%,9%{stroke:#22e1ff;fill:#103042}15%,100%{stroke:#2c3b55;fill:#131c2b}}
    @keyframes litg{0%{stroke:#2c3b55;fill:#131c2b}2%,9%{stroke:#2cff9a;fill:#0f3326}15%,100%{stroke:#2c3b55;fill:#131c2b}}
    .b{fill:#0a1a26;stroke:#22e1ff;stroke-width:1.6}
    .bg{fill:#0a2218;stroke:#2cff9a;stroke-width:1.6}
    .bn{fill:#dff;font-size:13px;font-weight:700;text-anchor:middle}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
    @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<rect width="1376" height="768" fill="url(#bg)"/>
<g stroke="#12203a" stroke-width="1" opacity=".6">
  <path d="M0 60H1376M0 700H1376"/>
</g>

<text x="688" y="54" class="t" style="font-size:26px;font-weight:700">SquareHealth-VMS — End-to-End Architecture</text>
<text x="688" y="84" class="t" style="font-size:19px"><tspan font-weight="700">Data Ingestion</tspan> → <tspan font-weight="700">UML &amp; Stack</tspan> → <tspan font-weight="700">Full-Stack Build</tspan> → <tspan font-weight="700">Cloud Deployment</tspan></text>

<!-- legend -->
<rect x="1052" y="24" width="282" height="71" rx="10" fill="#101a2a" stroke="#27374f"/>
<path d="M1066 45H1130" class="c"/>
<text x="1142" y="51" fill="#e8eef8" font-size="15">Build &amp; delivery pipeline</text>
<path d="M1130 75H1066" class="g"/>
<text x="1142" y="81" fill="#e8eef8" font-size="15">Verification &amp; feedback loop</text>

<!-- 5 panels -->
<rect class="panel" x="42" y="120" width="236" height="612" rx="14"/>
<rect class="panel" x="306" y="120" width="236" height="612" rx="14"/>
<rect class="panel" x="570" y="120" width="236" height="612" rx="14"/>
<rect class="panel" x="834" y="120" width="236" height="612" rx="14"/>
<rect class="panel" x="1098" y="120" width="236" height="612" rx="14"/>
<g stroke-width="3" stroke-linecap="round">
  <path d="M62 121H258" stroke="#22e1ff"/>
  <path d="M326 121H522" stroke="#7c9cff"/>
  <path d="M590 121H786" stroke="#2cff9a"/>
  <path d="M854 121H1050" stroke="#ffb84d"/>
  <path d="M1118 121H1314" stroke="#ff6fae"/>
</g>

<text x="160" y="148" class="h">1. DATA INGESTION</text><text x="160" y="170" class="s">Multi-Source Pipeline</text>
<text x="424" y="148" class="h">2. REQUIREMENTS</text><text x="424" y="170" class="s">&amp; UML Blueprints</text>
<text x="688" y="148" class="h">3. APPLICATION</text><text x="688" y="170" class="s">Flutter &amp; Spring Boot</text>
<text x="952" y="148" class="h">4. PERSISTENCE</text><text x="952" y="170" class="s">PostgreSQL &amp; Docker</text>
<text x="1216" y="148" class="h">5. CLOUD DEPLOY</text><text x="1216" y="170" class="s">CI/CD &amp; Production</text>

<!-- connectors (animated flow) -->
<g>
  <!-- vertical downward flows inside columns -->
  <path class="c" d="M160 278V312"/>
  <path class="c" d="M160 390V424"/>
  <path class="c" d="M160 502V536"/>

  <path class="c" d="M424 278V312"/>
  <path class="c" d="M424 390V424"/>
  <path class="c" d="M424 502V536"/>

  <path class="c" d="M688 278V312"/>
  <path class="c" d="M688 390V424"/>
  <path class="c" d="M688 502V536"/>

  <path class="c" d="M952 278V312"/>
  <path class="c" d="M952 390V424"/>
  <path class="c" d="M952 502V536"/>

  <path class="c" d="M1216 278V312"/>
  <path class="c" d="M1216 390V424"/>
  <path class="c" d="M1216 502V536"/>

  <!-- cross-column forward connectors -->
  <path class="c" d="M253 576H290V242H331"/>
  <path class="c" d="M517 576H554V242H595"/>
  <path class="c" d="M781 576H818V242H859"/>
  <path class="c" d="M1045 576H1082V242H1123"/>

  <!-- return feedback loop along bottom -->
  <path class="g" d="M1216 616V668H1045"/>
  <path class="g" d="M859 668H781"/>
  <path class="g" d="M595 668H517"/>
  <path class="g" d="M331 668H253"/>
</g>

<!-- Column 1: Data Ingestion -->
<rect class="n lc" style="animation-delay:0s" x="67" y="204" width="186" height="74" rx="10"/>
<text x="160" y="236" class="t">Udemy Curriculum</text><text x="160" y="258" class="s">(7 Sections, 28 Guides)</text>

