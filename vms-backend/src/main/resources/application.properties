spring.application.name=vms-backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.mapper.sort-properties-alphabetically=false

# Multipart Document Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
vms.storage.upload-dir=${VMS_UPLOAD_DIR:./uploads}

# JWT Configuration (Override JWT_SECRET in production)
vms.jwt.secret=${JWT_SECRET:U3RhcmtHcm91cFZNc1NlY3JldEtleUZvckhNQUNTSEEyNTZUb2tlblNpZ25pbmdBdExlYXN0NjRCeXRlcw==}
vms.jwt.expiration-ms=28800000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
