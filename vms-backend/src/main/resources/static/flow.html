<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SquareHealth-VMS – Request Flow</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#060a12;color:#e8eef8;font-family:Inter,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
  .wrap{width:100%;max-width:1400px}
  .bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:10px}
  .bar span{margin-right:auto;color:#9fb0c8;font-size:14px}
  button{background:#10202f;color:#dff6ff;border:1px solid #22e1ff;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#16324a}
  button:focus-visible{outline:2px solid #2cff9a;outline-offset:2px}
  .card{border:1px solid #1f2d44;border-radius:14px;overflow:hidden;box-shadow:0 0 40px rgba(34,225,255,.08)}
  .flow-obj{display:block;width:100%;height:auto}
  .paused .flow-obj *{animation-play-state:paused!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span>Cyan = request travelling downstream &nbsp;|&nbsp; Green = response travelling back</span>
    <button id="toggle" type="button">Pause Animation</button>
  </div>
  <div class="card" id="card">
    <object data="request_flow.svg" type="image/svg+xml" class="flow-obj" id="flowObj" style="width:100%; min-height:700px; display:block;"></object>
  </div>
</div>
<script>
  const card = document.getElementById('card');
  const btn = document.getElementById('toggle');
  let paused = false;
  btn.addEventListener('click', () => {
    paused = !paused;
    card.classList.toggle('paused', paused);
    btn.textContent = paused ? 'Play Animation' : 'Pause Animation';
  });
</script>
</body>
</html>
